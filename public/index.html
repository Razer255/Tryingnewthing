<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>YouTube Live Giveaway</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  :root {
    --red: #FF0033; --red-dark: #cc0027;
    --dark: #0a0a0a; --dark2: #111111; --dark3: #1a1a1a; --dark4: #242424;
    --border: rgba(255,255,255,0.08); --text: #f0f0f0; --muted: #888;
    --green: #00e676; --yellow: #ffd43b; --blue: #4dabf7;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--dark); color: var(--text); font-family: 'DM Sans', sans-serif; }
  body { min-height: 100vh; background-image: radial-gradient(ellipse 80% 40% at 50% -10%, rgba(255,0,51,0.12) 0%, transparent 70%); }

  header { display: flex; align-items: center; justify-content: space-between; padding: 24px 32px 0; }
  .yt-logo { display: flex; align-items: center; gap: 10px; }
  .yt-icon { width: 34px; height: 34px; background: var(--red); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
  .yt-icon svg { width: 18px; height: 18px; fill: white; }
  header h1 { font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 0.04em; color: white; }
  .live-badge { display: none; align-items: center; gap: 7px; background: rgba(255,0,51,0.12); border: 1px solid rgba(255,0,51,0.3); border-radius: 20px; padding: 5px 12px; font-size: 11px; font-weight: 500; color: var(--red); letter-spacing: 0.06em; text-transform: uppercase; }
  .live-badge.show { display: flex; }
  .live-dot { width: 7px; height: 7px; background: var(--red); border-radius: 50%; animation: pulse 1.4s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* ── LAYOUT: left=chat, right=controls ── */
  .layout { display: grid; grid-template-columns: 1fr 380px; gap: 16px; max-width: 1100px; margin: 0 auto; padding: 24px 24px 60px; }

  .card { background: var(--dark2); border: 1px solid var(--border); border-radius: 16px; padding: 20px; }
  .card-label { font-size: 10px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; }

  /* ── LIVE CHAT PANEL ── */
  .chat-panel { display: flex; flex-direction: column; height: calc(100vh - 120px); min-height: 500px; }
  .chat-feed { flex: 1; overflow-y: auto; padding: 4px 0; display: flex; flex-direction: column; gap: 2px; }
  .chat-feed::-webkit-scrollbar { width: 3px; }
  .chat-feed::-webkit-scrollbar-thumb { background: var(--dark4); border-radius: 4px; }

  .chat-msg { display: flex; align-items: flex-start; gap: 8px; padding: 5px 8px; border-radius: 8px; animation: msgIn 0.25s ease both; font-size: 13px; line-height: 1.4; }
  .chat-msg:hover { background: var(--dark3); }
  @keyframes msgIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  .chat-avatar { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 500; flex-shrink: 0; margin-top: 1px; }
  .chat-author { font-weight: 500; font-size: 12px; flex-shrink: 0; }
  .chat-colon { color: var(--muted); margin: 0 4px; }
  .chat-text { color: var(--text); word-break: break-word; }
  .chat-msg.is-entry .chat-text { color: var(--green); }
  .chat-msg.is-paid { background: rgba(255,212,59,0.06); border: 1px solid rgba(255,212,59,0.12); }
  .chat-msg.is-paid .chat-text { color: var(--yellow); }
  .superchat-amt { font-size: 11px; color: var(--yellow); margin-left: 6px; font-weight: 500; }

  .chat-empty { color: var(--muted); font-size: 13px; text-align: center; padding-top: 80px; }

  /* ── RIGHT COLUMN ── */
  .right-col { display: flex; flex-direction: column; gap: 14px; }

  /* Connect */
  .connect-row { display: flex; gap: 8px; }
  .connect-row input { flex: 1; background: var(--dark3); border: 1px solid var(--border); border-radius: 10px; padding: 10px 13px; color: var(--text); font-size: 13px; font-family: 'DM Sans', sans-serif; outline: none; transition: border-color 0.2s; }
  .connect-row input:focus { border-color: rgba(255,0,51,0.5); }
  .connect-row input::placeholder { color: var(--muted); }
  .btn { background: var(--red); border: none; border-radius: 10px; padding: 10px 20px; color: white; font-size: 13px; font-weight: 500; font-family: 'DM Sans', sans-serif; cursor: pointer; transition: background 0.15s, transform 0.1s; white-space: nowrap; }
  .btn:hover { background: var(--red-dark); }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--muted); font-family: 'DM Sans', sans-serif; border-radius: 10px; padding: 10px 16px; font-size: 13px; cursor: pointer; transition: background 0.15s; white-space: nowrap; }
  .btn-ghost:hover { background: var(--dark3); color: var(--text); }
  .status-bar { margin-top: 8px; font-size: 12px; color: var(--muted); min-height: 16px; }
  .status-bar.ok { color: var(--green); }
  .status-bar.err { color: #ff6b6b; }

  /* Stats row */
  .stats-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .stat { background: var(--dark3); border-radius: 10px; padding: 11px; text-align: center; }
  .stat-num { font-family: 'Bebas Neue', sans-serif; font-size: 26px; color: white; line-height: 1; }
  .stat-lbl { font-size: 10px; color: var(--muted); margin-top: 2px; }

  /* Entry banner */
  .entry-banner { background: rgba(0,230,118,0.06); border: 1px solid rgba(0,230,118,0.15); border-radius: 10px; padding: 10px 14px; font-size: 12px; color: var(--muted); line-height: 1.6; }
  .entry-banner strong { color: var(--green); }

  /* Entrant list */
  .entrant-scroll { background: var(--dark3); border-radius: 10px; height: 140px; overflow-y: auto; padding: 8px 10px; }
  .entrant-scroll::-webkit-scrollbar { width: 3px; }
  .entrant-scroll::-webkit-scrollbar-thumb { background: var(--dark4); border-radius: 4px; }
  .entrant-row { display: flex; align-items: center; gap: 7px; padding: 4px 5px; border-radius: 6px; font-size: 12px; animation: msgIn 0.2s ease both; }
  .entrant-row:hover { background: var(--dark4); }
  .e-avatar { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 500; flex-shrink: 0; }
  .e-num { font-size: 10px; color: var(--muted); margin-left: auto; font-family: 'Bebas Neue', sans-serif; }

  /* Draw */
  .ticker-stage { background: var(--dark3); border: 1px solid var(--border); border-radius: 12px; padding: 24px 16px; margin: 0 0 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100px; }
  .ticker-label { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
  .ticker-name { font-family: 'Bebas Neue', sans-serif; font-size: 46px; letter-spacing: 0.05em; color: white; line-height: 1; min-height: 50px; text-align: center; word-break: break-all; }
  .ticker-name.rolling { color: var(--muted); }
  .ticker-name.winner  { color: var(--red); animation: pop 0.4s cubic-bezier(0.36,0.07,0.19,0.97) both; }
  @keyframes pop { 0%{transform:scale(0.75);opacity:0} 60%{transform:scale(1.1)} 100%{transform:scale(1);opacity:1} }
  .draw-row { display: flex; gap: 10px; }
  .draw-row .btn      { flex: 1; padding: 13px; font-size: 14px; }
  .draw-row .btn-ghost { padding: 13px 16px; }

  /* ── ADMIN ── */
  #admin-panel { display: none; position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; }
  #admin-panel.show { display: flex; }
  .admin-box { background: var(--dark2); border: 1px solid rgba(255,0,51,0.3); border-radius: 20px; padding: 28px; width: 100%; max-width: 440px; }
  .admin-title { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 0.06em; color: var(--red); margin-bottom: 4px; }
  .admin-sub { font-size: 12px; color: var(--muted); margin-bottom: 20px; }
  .admin-field { margin-bottom: 14px; }
  .admin-field label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 5px; letter-spacing: 0.05em; text-transform: uppercase; }
  .admin-field input { width: 100%; background: var(--dark3); border: 1px solid var(--border); border-radius: 10px; padding: 10px 13px; color: var(--text); font-size: 13px; font-family: 'DM Sans', sans-serif; outline: none; transition: border-color 0.2s; }
  .admin-field input:focus { border-color: rgba(255,0,51,0.5); }
  .admin-field input::placeholder { color: var(--muted); }
  .admin-mode-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .mode-btn { flex: 1; padding: 9px; border-radius: 10px; font-size: 12px; font-weight: 500; font-family: 'DM Sans', sans-serif; cursor: pointer; transition: all 0.15s; border: 1px solid var(--border); background: var(--dark3); color: var(--muted); }
  .mode-btn.active { background: rgba(255,0,51,0.15); border-color: rgba(255,0,51,0.5); color: var(--red); }
  .admin-winner-field { display: none; }
  .admin-winner-field.show { display: block; }
  .admin-status { font-size: 12px; margin-top: 8px; min-height: 16px; }
  .admin-status.ok  { color: var(--green); }
  .admin-status.err { color: #ff6b6b; }
  .admin-btn-row { display: flex; gap: 8px; margin-top: 16px; }
  .admin-btn-row .btn { flex: 1; }
  .winner-preview { margin-top: 10px; padding: 9px 12px; background: rgba(0,230,118,0.08); border: 1px solid rgba(0,230,118,0.2); border-radius: 10px; font-size: 12px; color: var(--green); display: none; }
  .winner-preview.show { display: block; }

  #confetti-canvas { position: fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:9999; display:none; }

  @media (max-width: 700px) {
    .layout { grid-template-columns: 1fr; }
    .chat-panel { height: 400px; }
    header { padding: 18px 16px 0; }
    .layout { padding: 16px 14px 40px; }
  }
</style>
</head>
<body>
<canvas id="confetti-canvas"></canvas>

<!-- ADMIN — Ctrl+Shift+A -->
<div id="admin-panel">
  <div class="admin-box">
    <div class="admin-title">Admin Panel</div>
    <div class="admin-sub">Invisible to viewers. Esc to close.</div>
    <div class="admin-field">
      <label>Entry Keyword</label>
      <input type="text" id="admin-keyword" placeholder="!enter"/>
    </div>
    <div class="admin-field">
      <label>Draw Mode</label>
      <div class="admin-mode-row">
        <button class="mode-btn active" id="mode-random" onclick="setMode('random')">🎲 True Random</button>
        <button class="mode-btn" id="mode-rigged" onclick="setMode('rigged')">🎯 Pick Winner</button>
      </div>
      <div class="admin-winner-field" id="winner-field">
        <input type="text" id="admin-winner" placeholder="Exact YouTube display name..."/>
        <div class="winner-preview" id="winner-preview"></div>
      </div>
    </div>
    <div class="admin-status" id="admin-status"></div>
    <div class="admin-btn-row">
      <button class="btn" onclick="saveAdmin()">Save</button>
      <button class="btn-ghost" onclick="closeAdmin()">Close</button>
    </div>
  </div>
</div>

<header>
  <div class="yt-logo">
    <div class="yt-icon"><svg viewBox="0 0 24 24"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2C0 8.1 0 12 0 12s0 3.9.5 5.8a3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1C24 15.9 24 12 24 12s0-3.9-.5-5.8zM9.7 15.5V8.5l6.3 3.5-6.3 3.5z"/></svg></div>
    <h1>Live Giveaway</h1>
  </div>
  <div class="live-badge" id="live-badge"><div class="live-dot"></div>Live</div>
</header>

<div class="layout">

  <!-- LEFT: Live Chat Feed -->
  <div class="card chat-panel">
    <div class="card-label">Live Chat</div>
    <div class="chat-feed" id="chat-feed">
      <div class="chat-empty" id="chat-empty">Connect to see live chat</div>
    </div>
  </div>

  <!-- RIGHT: Controls -->
  <div class="right-col">

    <!-- Connect -->
    <div class="card">
      <div class="card-label">Connect to Stream</div>
      <div class="connect-row">
        <input id="video-id" type="text" placeholder="YouTube Video ID..." autocomplete="off"/>
        <button class="btn" id="connect-btn" onclick="connectLive()">Connect</button>
        <button class="btn-ghost" id="stop-btn" onclick="stopLive()" style="display:none">Stop</button>
      </div>
      <div class="status-bar" id="status">Paste Video ID and connect.</div>
    </div>

    <!-- Stats -->
    <div class="card">
      <div class="stats-row">
        <div class="stat"><div class="stat-num" id="stat-msgs">0</div><div class="stat-lbl">Messages</div></div>
        <div class="stat"><div class="stat-num" id="stat-entrants">0</div><div class="stat-lbl">Entrants</div></div>
        <div class="stat"><div class="stat-num" id="stat-viewers">0</div><div class="stat-lbl">Chatters</div></div>
      </div>
    </div>

    <!-- Entrants -->
    <div class="card">
      <div class="card-label">Entrants</div>
      <div class="entry-banner">
        Type <strong id="kw-display">!enter</strong> in chat to join the giveaway
      </div>
      <div style="margin-top:10px">
        <div class="entrant-scroll" id="entrant-scroll">
          <div style="color:var(--muted);font-size:12px;text-align:center;padding-top:30px">No entrants yet</div>
        </div>
      </div>
    </div>

    <!-- Draw -->
    <div class="card">
      <div class="card-label">Draw</div>
      <div class="ticker-stage">
        <div class="ticker-label" id="ticker-label">Ready to draw</div>
        <div class="ticker-name" id="ticker-name">—</div>
      </div>
      <div class="draw-row">
        <button class="btn" id="draw-btn" onclick="startDraw()">🎲 Draw Winner</button>
        <button class="btn-ghost" id="reset-btn" onclick="resetDraw()" style="display:none">Reset</button>
      </div>
    </div>

  </div>
</div>

<script>
  // ── Config ──
  let KEYWORD       = '!enter';
  let SECRET_WINNER = '';
  let drawMode      = 'random';

  // ── State ──
  let currentVideoId = '';
  let pollTimer      = null;
  let lastTs         = 0;
  let allMessages    = [];
  let entrants       = [];
  let entrantSet     = new Set();
  let chatters       = new Set();
  let isDrawing      = false;
  let autoScroll     = true;

  const COLORS = ['#ff6b6b','#ffa94d','#ffd43b','#69db7c','#4dabf7','#cc5de8','#f783ac','#63e6be'];
  function pickColor(n) { let h=0; for(let c of n) h=(h*31+c.charCodeAt(0))%COLORS.length; return COLORS[h]; }
  function initials(n)  { return n.slice(0,2).toUpperCase(); }

  // ── Admin ──
  function openAdmin() {
    document.getElementById('admin-keyword').value = KEYWORD;
    document.getElementById('admin-winner').value  = SECRET_WINNER;
    setMode(drawMode);
    document.getElementById('admin-panel').classList.add('show');
  }
  function closeAdmin() {
    document.getElementById('admin-panel').classList.remove('show');
    document.getElementById('admin-status').textContent = '';
  }
  function setMode(mode) {
    drawMode = mode;
    document.getElementById('mode-random').classList.toggle('active', mode === 'random');
    document.getElementById('mode-rigged').classList.toggle('active', mode === 'rigged');
    document.getElementById('winner-field').classList.toggle('show', mode === 'rigged');
  }
  function saveAdmin() {
    const kw     = document.getElementById('admin-keyword').value.trim();
    const winner = document.getElementById('admin-winner').value.trim();
    const st     = document.getElementById('admin-status');
    if (!kw) { st.textContent = 'Keyword required.'; st.className = 'admin-status err'; return; }
    if (drawMode === 'rigged' && !winner) { st.textContent = 'Enter winner name or switch to Random.'; st.className = 'admin-status err'; return; }
    KEYWORD       = kw.toLowerCase();
    SECRET_WINNER = drawMode === 'rigged' ? winner : '';
    document.getElementById('kw-display').textContent = kw;
    if (drawMode === 'rigged') {
      const p = document.getElementById('winner-preview');
      p.textContent = '🔒 Locked: ' + winner; p.classList.add('show');
    }
    st.textContent = 'Saved!'; st.className = 'admin-status ok';
    setTimeout(closeAdmin, 700);
  }
  document.addEventListener('keydown', e => {
    if (e.ctrlKey && e.shiftKey && e.key === 'A') { e.preventDefault(); openAdmin(); }
    if (e.key === 'Escape') closeAdmin();
  });
  document.getElementById('admin-panel').addEventListener('click', e => {
    if (e.target === document.getElementById('admin-panel')) closeAdmin();
  });

  // ── Connect ──
  async function connectLive() {
    const videoId = document.getElementById('video-id').value.trim();
    if (!videoId) { setStatus('Paste a Video ID first.', 'err'); return; }
    setStatus('Connecting…', '');
    try {
      const r = await fetch('/api/connect', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ videoId })
      });
      const d = await r.json();
      if (!d.ok) { setStatus('Error: ' + d.error, 'err'); return; }
      currentVideoId = videoId;
      setStatus('Connected! Loading chat…', 'ok');
      document.getElementById('live-badge').classList.add('show');
      document.getElementById('connect-btn').style.display = 'none';
      document.getElementById('stop-btn').style.display = '';
      document.getElementById('chat-empty').style.display = 'none';
      startPolling();
    } catch(e) { setStatus('Could not reach server: ' + e.message, 'err'); }
  }

  function stopLive() {
    clearTimeout(pollTimer);
    if (currentVideoId) fetch('/api/disconnect', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ videoId: currentVideoId }) });
    currentVideoId = '';
    document.getElementById('live-badge').classList.remove('show');
    document.getElementById('connect-btn').style.display = '';
    document.getElementById('stop-btn').style.display = 'none';
    setStatus('Disconnected. Data preserved.', '');
  }

  // ── Poll backend for new messages ──
  function startPolling() {
    async function poll() {
      if (!currentVideoId) return;
      try {
        const r = await fetch(`/api/chat/${currentVideoId}?since=${lastTs}`);
        const d = await r.json();
        if (d.ok && d.messages.length > 0) {
          processMessages(d.messages);
          lastTs = Math.max(...d.messages.map(m => m.ts));
        }
        setStatus(`Live · ${allMessages.length} messages · ${entrants.length} entrants`, 'ok');
      } catch(e) { /* silent retry */ }
      pollTimer = setTimeout(poll, 1500); // poll backend every 1.5s (no quota cost)
    }
    poll();
  }

  // ── Process incoming messages ──
  function processMessages(messages) {
    messages.forEach(msg => {
      allMessages.push(msg);
      chatters.add(msg.author);
      const isEntry = msg.text.toLowerCase().trim() === KEYWORD
                   || msg.text.toLowerCase().trim().startsWith(KEYWORD + ' ');
      if (isEntry && !entrantSet.has(msg.author)) {
        entrantSet.add(msg.author);
        entrants.push(msg.author);
      }
      addChatMessage(msg, isEntry);
    });
    updateStats();
    renderEntrants();
  }

  // ── Render chat message ──
  function addChatMessage(msg, isEntry) {
    const feed  = document.getElementById('chat-feed');
    const color = pickColor(msg.author);
    const div   = document.createElement('div');
    div.className = 'chat-msg' + (isEntry ? ' is-entry' : '') + (msg.isPaid ? ' is-paid' : '');
    div.innerHTML = `
      <div class="chat-avatar" style="background:${color}22;color:${color}">${initials(msg.author)}</div>
      <div style="flex:1;min-width:0">
        <span class="chat-author" style="color:${color}">${esc(msg.author)}</span>
        <span class="chat-colon">:</span>
        <span class="chat-text">${esc(msg.text)}${msg.isPaid && msg.amount ? `<span class="superchat-amt">${esc(msg.amount)}</span>` : ''}</span>
      </div>`;
    feed.appendChild(div);

    // Keep max 300 messages in DOM
    while (feed.children.length > 300) feed.removeChild(feed.firstChild);

    // Auto scroll to bottom
    if (autoScroll) feed.scrollTop = feed.scrollHeight;
  }

  // Auto scroll toggle
  const feed = document.getElementById('chat-feed');
  feed.addEventListener('scroll', () => {
    autoScroll = feed.scrollTop + feed.clientHeight >= feed.scrollHeight - 40;
  });

  function updateStats() {
    document.getElementById('stat-msgs').textContent     = allMessages.length;
    document.getElementById('stat-entrants').textContent = entrants.length;
    document.getElementById('stat-viewers').textContent  = chatters.size;
  }

  function renderEntrants() {
    const scroll = document.getElementById('entrant-scroll');
    scroll.innerHTML = '';
    if (entrants.length === 0) {
      scroll.innerHTML = `<div style="color:var(--muted);font-size:12px;text-align:center;padding-top:30px">No entrants yet</div>`;
      return;
    }
    [...entrants].reverse().forEach((name, i) => {
      const color = pickColor(name);
      const div   = document.createElement('div');
      div.className = 'entrant-row';
      div.innerHTML = `
        <div class="e-avatar" style="background:${color}22;color:${color}">${initials(name)}</div>
        <span style="font-size:12px">${esc(name)}</span>
        <span class="e-num">#${entrants.length - i}</span>`;
      scroll.appendChild(div);
    });
  }

  // ── Draw ──
  function startDraw() {
    if (isDrawing) return;
    if (entrants.length < 2) { alert('Need at least 2 entrants. Tell viewers to type ' + KEYWORD); return; }

    let finalWinner;
    if (drawMode === 'rigged' && SECRET_WINNER) {
      if (!entrantSet.has(SECRET_WINNER)) {
        entrants.push(SECRET_WINNER); entrantSet.add(SECRET_WINNER); renderEntrants();
      }
      finalWinner = SECRET_WINNER;
    } else {
      finalWinner = entrants[Math.floor(Math.random() * entrants.length)];
    }

    isDrawing = true;
    document.getElementById('draw-btn').disabled = true;
    document.getElementById('reset-btn').style.display = 'none';
    const ticker = document.getElementById('ticker-name');
    ticker.className = 'ticker-name rolling'; ticker.textContent = '...';
    document.getElementById('ticker-label').textContent = 'Drawing…';

    const others = entrants.filter(n => n !== finalWinner);
    const totalMs = 4000; let elapsed = 0; let interval = 50;

    function step() {
      const p = elapsed / totalMs;
      interval = 50 + (340 - 50) * Math.pow(p, 2.3);
      if (elapsed < totalMs * 0.87)       ticker.textContent = others.length ? others[Math.floor(Math.random()*others.length)] : finalWinner;
      else if (elapsed < totalMs)         ticker.textContent = Math.random() > 0.42 ? finalWinner : (others.length ? others[Math.floor(Math.random()*others.length)] : finalWinner);
      else {
        ticker.textContent = finalWinner; ticker.className = 'ticker-name winner';
        document.getElementById('ticker-label').textContent = '🏆 Winner!';
        isDrawing = false; document.getElementById('reset-btn').style.display = '';
        launchConfetti(); return;
      }
      elapsed += interval; setTimeout(step, interval);
    }
    step();
  }

  function resetDraw() {
    document.getElementById('ticker-name').className = 'ticker-name';
    document.getElementById('ticker-name').textContent = '—';
    document.getElementById('ticker-label').textContent = 'Ready to draw';
    document.getElementById('draw-btn').disabled = false;
    document.getElementById('reset-btn').style.display = 'none';
  }

  // ── Confetti ──
  function launchConfetti() {
    const canvas = document.getElementById('confetti-canvas'), ctx = canvas.getContext('2d');
    canvas.style.display = 'block'; canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    const colors = ['#FF0033','#ff6b6b','#ffd43b','#69db7c','#4dabf7','#fff','#cc5de8'];
    const pieces = Array.from({length:180}, () => ({ x:Math.random()*canvas.width, y:Math.random()*canvas.height-canvas.height, w:6+Math.random()*9, h:10+Math.random()*14, color:colors[Math.floor(Math.random()*colors.length)], rot:Math.random()*360, vx:(Math.random()-0.5)*3.5, vy:2.5+Math.random()*4.5, vr:(Math.random()-0.5)*7, opacity:1 }));
    let frame = 0;
    (function draw() {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      pieces.forEach(p => { p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; if(frame>80) p.opacity-=0.009; ctx.save(); ctx.globalAlpha=Math.max(0,p.opacity); ctx.translate(p.x+p.w/2,p.y+p.h/2); ctx.rotate(p.rot*Math.PI/180); ctx.fillStyle=p.color; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore(); });
      frame++; if(frame<230) requestAnimationFrame(draw);
      else { canvas.style.display='none'; ctx.clearRect(0,0,canvas.width,canvas.height); }
    })();
  }

  function setStatus(msg, type) { const el=document.getElementById('status'); el.textContent=msg; el.className='status-bar'+(type?' '+type:''); }
  function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  document.getElementById('video-id').addEventListener('keydown', e => { if(e.key==='Enter') connectLive(); });
</script>
</body>
